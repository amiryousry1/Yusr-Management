<!doctype html>
<html lang="ar" dir="rtl" class="h-full bg-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#075f63" />
  <title>مركز تحكم يسر · Yusr Dashboard V2</title>

  <!-- Google Fonts: Cairo & Tajawal -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

  <!-- Lucide Icons Library CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Tailwind CSS v3 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Cairo', 'Tajawal', 'system-ui', 'sans-serif'],
            display: ['Tajawal', 'Cairo', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0fdfc',
              100: '#ccfbf1',
              200: '#99f6e4',
              300: '#5eead4',
              400: '#2dd4bf',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              800: '#075f63',
              900: '#043e41',
              950: '#022729',
            },
            mint: {
              400: '#34d399',
              500: '#10b981',
              600: '#05d58a',
            }
          },
          boxShadow: {
            'glass': '0 20px 50px rgba(7, 95, 99, 0.08)',
            'card': '0 4px 20px -2px rgba(15, 23, 42, 0.04), 0 2px 6px -1px rgba(15, 23, 42, 0.02)',
            'card-hover': '0 12px 30px -4px rgba(7, 95, 99, 0.12), 0 4px 12px -2px rgba(15, 23, 42, 0.04)',
          }
        }
      }
    }
  </script>

  <!-- External Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="h-full bg-slate-100 text-slate-800 antialiased selection:bg-brand-100 selection:text-brand-900">

  <!-- App Wrapper Shell -->
  <div id="app" class="min-h-screen flex flex-col lg:flex-row max-w-[1600px] mx-auto p-2 sm:p-4 lg:p-6 gap-4 lg:gap-6">
    
    <!-- Sidebar Overlay for Mobile -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 lg:hidden hidden transition-opacity"></div>

    <!-- Scrollable Sidebar Navigation -->
    <aside id="sidebar" class="fixed lg:sticky top-0 lg:top-6 right-0 h-full lg:h-[calc(100vh-3rem)] w-72 bg-white border-l border-slate-200/80 lg:rounded-3xl shadow-2xl lg:shadow-glass z-50 flex flex-col justify-between p-5 overflow-y-auto transition-transform duration-300 transform translate-x-full lg:translate-x-0 shrink-0">
      
      <div>
        <!-- Brand Header -->
        <div class="flex items-center gap-3 px-2 pb-6 mb-4 border-b border-slate-100">
          <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-brand-900 via-brand-800 to-teal-600 text-white font-extrabold text-2xl flex items-center justify-center shadow-lg shadow-brand-800/20">
            يسر
          </div>
          <div>
            <h1 class="text-xl font-black text-brand-950 tracking-tight">يسر</h1>
            <p class="text-xs font-semibold text-slate-400">داشبورد الإدارة V2.0</p>
          </div>
        </div>

        <!-- Navigation Links Section -->
        <div class="text-[11px] font-bold text-slate-400 px-3 mb-2 tracking-wider">القائمة الرئيسية</div>
        <nav id="nav" class="space-y-1">
          <button class="nav-item active w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold text-slate-600 hover:text-brand-800 hover:bg-brand-50 transition-all group" data-page="overview">
            <span class="w-7 h-7 rounded-lg bg-slate-100 text-slate-500 flex items-center justify-center group-hover:bg-brand-800 group-hover:text-white transition-colors">
              <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
            </span>
            <span>نظرة عامة</span>
          </button>

          <button class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold text-slate-600 hover:text-brand-800 hover:bg-brand-50 transition-all group" data-page="rounds">
            <span class="w-7 h-7 rounded-lg bg-slate-100 text-slate-500 flex items-center justify-center group-hover:bg-brand-800 group-hover:text-white transition-colors">
              <i data-lucide="target" class="w-4 h-4"></i>
            </span>
            <span>الراوندات الحالية</span>
          </button>

          <button class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold text-slate-600 hover:text-brand-800 hover:bg-brand-50 transition-all group" data-page="campaigns">
            <span class="w-7 h-7 rounded-lg bg-slate-100 text-slate-500 flex items-center justify-center group-hover:bg-brand-800 group-hover:text-white transition-colors">
              <i data-lucide="megaphone" class="w-4 h-4"></i>
            </span>
            <span>الحملات والمحتوى</span>
          </button>

          <button class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold text-slate-600 hover:text-brand-800 hover:bg-brand-50 transition-all group" data-page="scenario">
            <span class="w-7 h-7 rounded-lg bg-slate-100 text-slate-500 flex items-center justify-center group-hover:bg-brand-800 group-hover:text-white transition-colors">
              <i data-lucide="sliders" class="w-4 h-4"></i>
            </span>
            <span>محاكي الراوند</span>
          </button>

          <button class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold text-slate-600 hover:text-brand-800 hover:bg-brand-50 transition-all group" data-page="programs">
            <span class="w-7 h-7 rounded-lg bg-slate-100 text-slate-500 flex items-center justify-center group-hover:bg-brand-800 group-hover:text-white transition-colors">
              <i data-lucide="book-open" class="w-4 h-4"></i>
            </span>
            <span>البرامج والفرص</span>
          </button>

          <button class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold text-slate-600 hover:text-brand-800 hover:bg-brand-50 transition-all group" data-page="universities">
            <span class="w-7 h-7 rounded-lg bg-slate-100 text-slate-500 flex items-center justify-center group-hover:bg-brand-800 group-hover:text-white transition-colors">
              <i data-lucide="graduation-cap" class="w-4 h-4"></i>
            </span>
            <span>الجامعات</span>
          </button>

          <button class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold text-slate-600 hover:text-brand-800 hover:bg-brand-50 transition-all group" data-page="partners">
            <span class="w-7 h-7 rounded-lg bg-slate-100 text-slate-500 flex items-center justify-center group-hover:bg-brand-800 group-hover:text-white transition-colors">
              <i data-lucide="handshake" class="w-4 h-4"></i>
            </span>
            <span>العلاقات والشراكات</span>
          </button>

          <button class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold text-slate-600 hover:text-brand-800 hover:bg-brand-50 transition-all group" data-page="validation">
            <span class="w-7 h-7 rounded-lg bg-slate-100 text-slate-500 flex items-center justify-center group-hover:bg-brand-800 group-hover:text-white transition-colors">
              <i data-lucide="check-circle-2" class="w-4 h-4"></i>
            </span>
            <span>التحقق من السوق</span>
          </button>

          <button class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold text-slate-600 hover:text-brand-800 hover:bg-brand-50 transition-all group" data-page="finance">
            <span class="w-7 h-7 rounded-lg bg-slate-100 text-slate-500 flex items-center justify-center group-hover:bg-brand-800 group-hover:text-white transition-colors">
              <i data-lucide="dollar-sign" class="w-4 h-4"></i>
            </span>
            <span>الماليات</span>
          </button>

          <button class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold text-slate-600 hover:text-brand-800 hover:bg-brand-50 transition-all group" data-page="explorer">
            <span class="w-7 h-7 rounded-lg bg-slate-100 text-slate-500 flex items-center justify-center group-hover:bg-brand-800 group-hover:text-white transition-colors">
              <i data-lucide="search" class="w-4 h-4"></i>
            </span>
            <span>البحث في البيانات</span>
          </button>

          <button class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold text-slate-600 hover:text-brand-800 hover:bg-brand-50 transition-all group" data-page="guide">
            <span class="w-7 h-7 rounded-lg bg-slate-100 text-slate-500 flex items-center justify-center group-hover:bg-brand-800 group-hover:text-white transition-colors">
              <i data-lucide="help-circle" class="w-4 h-4"></i>
            </span>
            <span>طريقة الاستخدام</span>
          </button>
        </nav>
      </div>

      <!-- Sidebar Footer Badge -->
      <div class="pt-4 mt-6 border-t border-slate-100 shrink-0">
        <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-xl bg-emerald-50 text-emerald-800 text-xs font-bold border border-emerald-200/60 mb-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          نظام للقراءة فقط
        </div>
        <p class="text-[11px] text-slate-400 font-medium leading-relaxed">المصدر الوحيد للحقيقة هو Google Sheet الرسمي</p>
      </div>
    </aside>

    <!-- Main Content Workspace -->
    <main class="flex-1 bg-white border border-slate-200/80 rounded-2xl lg:rounded-3xl shadow-sm overflow-hidden flex flex-col min-w-0">
      
      <!-- Topbar Header -->
      <header class="bg-white border-b border-slate-100 px-4 sm:px-6 py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4 sticky top-0 z-30">
        <div class="flex items-center justify-between gap-3">
          <button id="menuBtn" class="lg:hidden p-2 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 transition-colors" aria-label="افتح القائمة">
            <i data-lucide="menu" class="w-5 h-5"></i>
          </button>
          <div>
            <h1 id="pageTitle" class="text-lg sm:text-xl font-extrabold text-slate-900 tracking-tight">نظرة عامة</h1>
            <p id="pageSubtitle" class="text-xs text-slate-500 mt-0.5 truncate max-w-md sm:max-w-xl">الصورة السريعة: القرارات، البرامج، الجامعات والحالة الحالية للبيانات</p>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <!-- Search Input Bar -->
          <div class="relative flex-1 sm:w-80 bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 flex items-center gap-2 focus-within:border-brand-600 focus-within:ring-2 focus-within:ring-brand-600/10 transition-all">
            <i data-lucide="search" class="w-4 h-4 text-slate-400 shrink-0"></i>
            <input id="globalSearch" type="search" dir="auto" placeholder="ابحث عن برنامج، جامعة، أو قرار... (Ctrl+K)" autocomplete="off" class="w-full bg-transparent text-xs text-slate-800 placeholder-slate-400 outline-none border-none py-1" />
          </div>

          <!-- Refresh Data Button -->
          <button id="refreshBtn" class="px-3.5 py-2 rounded-xl bg-brand-50 hover:bg-brand-100 text-brand-800 font-bold text-xs border border-brand-200/70 flex items-center gap-2 shrink-0 transition-all active:scale-95" title="تحديث البيانات">
            <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
            <span class="hidden sm:inline">تحديث</span>
          </button>
        </div>
      </header>

      <!-- Status Bar Strip -->
      <div id="statusStrip" class="relative cursor-pointer px-4 sm:px-6 py-2.5 bg-slate-50 border-b border-slate-100 text-xs font-semibold text-slate-600 flex items-center justify-between gap-2 flex-wrap hover:bg-slate-100/80 transition-colors" title="انقر لرؤية تفاصيل صحة مصادر البيانات">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 ring-4 ring-emerald-500/20"></span>
          <span id="dataStatus">جاري التحميل من Google Sheet...</span>
        </div>
        <span id="lastUpdated" class="text-slate-400 text-[11px] font-normal mr-auto"></span>

        <!-- Source Health Popover Panel -->
        <div id="healthPanel" class="source-health-panel" onclick="event.stopPropagation()"></div>
      </div>

      <!-- Dynamic Page Root Workspace -->
      <section id="pageRoot" class="p-4 sm:p-6 lg:p-8 flex-1 space-y-6 overflow-x-hidden" aria-live="polite"></section>
    </main>
  </div>

  <!-- Global Toast Notification -->
  <div id="toast" class="fixed bottom-6 left-6 z-50 bg-slate-900 text-white font-bold text-xs px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 border border-slate-800"></div>

  <!-- Dashboard Configuration -->
  <script>
    window.YUSR_DASHBOARD_CONFIG = {
      sheetId: '1-C1xwPHavYFTuID7Y-FqF27m4ixLjN5NgRMEH469qKM',
      sheetUrl: 'https://docs.google.com/spreadsheets/d/1-C1xwPHavYFTuID7Y-FqF27m4ixLjN5NgRMEH469qKM/edit',
      accessMode: 'gviz',
      refreshMs: 3600000, // Auto-refresh set to 1 hour (3,600,000 ms)
      fallbackToSnapshot: true,
      currency: 'EGP',
      sources: {
        decision: 'Decision Center',
        launch: 'Launch Packs',
        opportunities: 'Course Opportunities',
        finance: 'Finance Control',
        financialModels: 'Financial Models',
        validation: 'Validation Tracker',
        universities: 'University Priorities',
        partners: 'Partnerships',
        kpis: 'KPIs',
        marketing: 'Marketing Channels',
        rounds: 'Rounds',
        campaigns: 'Campaigns'
      }
    };
  </script>

  <!-- Snapshot Data Fallback -->
  <script src="snapshot.js"></script>

  <!-- Application Logic -->
  <script src="app.js"></script>
</body>
</html>
