<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#075f63" />
  <title>مركز تحكم يسر</title>
  <style>
:root {
  --bg: #e9edf0;
  --shell: #ffffff;
  --surface: #ffffff;
  --surface-soft: #f7f9f9;
  --surface-muted: #f2f5f5;
  --ink: #142321;
  --muted: #778480;
  --muted-2: #9ba6a2;
  --line: #e5eae8;
  --line-strong: #d9e0dd;
  --brand: #075f63;
  --brand-deep: #07585c;
  --brand-dark: #06484c;
  --brand-soft: #e8f3f1;
  --mint: #05d58a;
  --mint-dark: #00b978;
  --mint-soft: #e8fbf3;
  --orange: #f28a3d;
  --orange-soft: #fff2e8;
  --green: #0ab878;
  --green-soft: #e9faf3;
  --yellow: #b88318;
  --yellow-soft: #fff7df;
  --red: #ec5e73;
  --red-soft: #fff0f3;
  --shadow: 0 24px 70px rgba(28, 44, 40, .10);
  --shadow-card: 0 2px 12px rgba(19, 38, 34, .035);
  --radius: 18px;
  --radius-lg: 24px;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; background: var(--bg); }
body {
  margin: 0;
  min-height: 100vh;
  font-family: Inter, "Segoe UI", Tahoma, Arial, sans-serif;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; }
button { cursor: pointer; }

/* Clean app frame inspired by the supplied reference */
.app-shell {
  width: min(1500px, calc(100% - 44px));
  min-height: calc(100vh - 44px);
  margin: 22px auto;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 238px;
  grid-template-areas: "main sidebar";
  direction: rtl;
  background: var(--shell);
  border: 1px solid rgba(255,255,255,.85);
  border-radius: 26px;
  box-shadow: var(--shadow);
  overflow: hidden;
}

.sidebar {
  grid-area: sidebar;
  direction: rtl;
  background: #fbfcfc;
  color: var(--ink);
  padding: 24px 14px 16px;
  display: flex;
  flex-direction: column;
  border-left: 1px solid var(--line);
  border-right: none;
  min-height: calc(100vh - 44px);
  position: sticky;
  top: 22px;
  z-index: 20;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 8px 22px;
  margin-bottom: 12px;
}
.brand-mark {
  width: 36px;
  height: 36px;
  border-radius: 11px;
  background: var(--brand);
  color: #fff;
  display: grid;
  place-items: center;
  font-size: 20px;
  font-weight: 900;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.12);
}
.brand-name { font-size: 17px; line-height: 1.15; font-weight: 850; color: var(--brand-dark); }
.brand-subtitle { font-size: 10px; color: var(--muted-2); margin-top: 2px; font-weight: 600; letter-spacing: .02em; }
.nav::before {
  content: "التنقل الرئيسي";
  display: block;
  padding: 0 10px 7px;
  font-size: 9px;
  color: #b2bbb8;
  letter-spacing: .08em;
  text-align: right;
  direction: rtl;
}
.nav { display: grid; gap: 4px; }
.nav-item {
  border: 1px solid transparent;
  background: transparent;
  color: #53615e;
  border-radius: 10px;
  padding: 10px 10px;
  display: flex;
  align-items: center;
  gap: 10px;
  text-align: right;
  transition: .16s ease;
  font-size: 12px;
  font-weight: 650;
}
.nav-item span {
  width: 20px;
  height: 20px;
  border-radius: 7px;
  display: grid;
  place-items: center;
  font-size: 13px;
  color: #60706c;
}
.nav-item:hover { background: #f2f5f4; color: var(--brand); }
.nav-item.active {
  background: #ffffff;
  color: var(--brand);
  border-color: var(--line);
  box-shadow: 0 3px 12px rgba(25, 49, 44, .06);
}
.nav-item.active span { background: var(--brand); color: #fff; }
.sidebar-foot {
  margin-top: auto;
  padding: 14px 8px 2px;
  border-top: 1px solid var(--line);
}
.read-only-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--mint-soft);
  color: #087954;
  padding: 7px 9px;
  border-radius: 9px;
  font-size: 10px;
  font-weight: 800;
}

.main { direction: rtl; min-width: 0; background: #fff; }
.topbar {
  min-height: 74px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  padding: 16px 22px 12px;
  background: #fff;
  border-bottom: 1px solid #f2f4f3;
}
.topbar-title { display: flex; align-items: center; gap: 10px; min-width: 0; }
.topbar h1 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.02em; }
.topbar p { margin: 3px 0 0; color: var(--muted); font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 540px; }
.topbar-actions { display: flex; align-items: center; gap: 8px; direction: rtl; }
.global-search-wrap {
  background: #fff;
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0 10px;
  min-width: 300px;
  height: 38px;
  transition: .16s ease;
}
.global-search-wrap:focus-within { border-color: #a8bbb6; box-shadow: 0 0 0 3px rgba(7,95,99,.06); }
.global-search-wrap span { color: #84908d; font-size: 14px; }
.global-search-wrap input { width: 100%; border: 0; outline: 0; padding: 8px 0; background: transparent; color: var(--ink); font-size: 11px; }
.refresh-button, .icon-button {
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: #394845;
  border-radius: 10px;
  height: 38px;
  padding: 0 11px;
  font-size: 11px;
  font-weight: 700;
}
.refresh-button:hover, .icon-button:hover { background: #f8faf9; border-color: #bfcac7; }
.mobile-only { display: none; }

.status-strip {
  margin: 10px 22px 12px;
  min-height: 29px;
  display: flex;
  align-items: center;
  gap: 7px;
  color: #4c6f66;
  padding: 4px 2px;
  font-size: 9.5px;
  background: transparent;
}
.status-strip.warning { color: #926e18; }
.status-strip.error { color: #a54152; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--mint-dark); box-shadow: 0 0 0 3px rgba(5,213,138,.12); }
.status-strip.warning .status-dot { background: #dfac2f; box-shadow: 0 0 0 3px rgba(223,172,47,.12); }
.status-strip.error .status-dot { background: var(--red); box-shadow: 0 0 0 3px rgba(236,94,115,.11); }
.status-time { margin-inline-start: auto; color: #9aa4a1; }

.page-root { padding: 0 22px 28px; }
.page-grid { display: grid; gap: 12px; }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

/* Dashboard overview hero */
.hero-banner {
  position: relative;
  overflow: hidden;
  display: grid;
  grid-template-columns: 1.5fr auto;
  gap: 20px;
  align-items: center;
  min-height: 132px;
  padding: 22px 24px;
  color: #fff;
  background: linear-gradient(105deg, #086168 0%, #075b61 55%, #075158 100%);
  border-radius: 17px;
  margin-bottom: 12px;
}
.hero-banner::after {
  content: "";
  position: absolute;
  inset: 0;
  opacity: .18;
  background-image:
    radial-gradient(circle at 86% 26%, transparent 0 30px, rgba(255,255,255,.18) 31px 32px, transparent 33px),
    radial-gradient(circle at 75% 80%, transparent 0 55px, rgba(255,255,255,.12) 56px 57px, transparent 58px),
    linear-gradient(135deg, transparent 70%, rgba(255,255,255,.08) 70% 71%, transparent 71%);
  pointer-events: none;
}
.hero-copy, .hero-actions { position: relative; z-index: 1; }
.hero-eyebrow { font-size: 10px; color: rgba(255,255,255,.78); font-weight: 700; margin-bottom: 7px; }
.hero-value { font-size: 32px; font-weight: 800; line-height: 1; letter-spacing: -.03em; }
.hero-value small { font-size: 11px; color: #7ff1c5; margin-inline-start: 7px; font-weight: 700; }
.hero-sub { margin-top: 9px; max-width: 560px; font-size: 10.5px; line-height: 1.65; color: rgba(255,255,255,.7); }
.hero-actions { display: flex; gap: 7px; flex-wrap: wrap; justify-content: flex-end; }
.hero-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 34px;
  padding: 0 12px;
  border-radius: 9px;
  border: 1px solid rgba(255,255,255,.14);
  background: rgba(255,255,255,.08);
  color: #fff;
  font-size: 10px;
  font-weight: 750;
}
.hero-pill.primary { background: var(--mint); color: #073f35; border-color: var(--mint); }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 15px;
  box-shadow: var(--shadow-card);
}
.card.pad { padding: 15px; }
.card-title { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
.card-title h2, .card-title h3 { margin: 0; font-size: 13px; font-weight: 800; }
.card-title p { margin: 3px 0 0; color: var(--muted); font-size: 9.5px; }

.kpi-card { padding: 15px 16px; min-height: 104px; position: relative; overflow: hidden; }
.kpi-card::before {
  content: "";
  position: absolute;
  width: 28px;
  height: 28px;
  left: 14px;
  top: 14px;
  border-radius: 9px;
  background: var(--mint-soft);
}
.kpi-card::after { display: none; }
.kpi-label { color: #546360; font-size: 9.5px; font-weight: 700; padding-left: 36px; min-height: 28px; display: flex; align-items: center; }
.kpi-value { font-size: 24px; font-weight: 780; margin: 6px 0 2px; letter-spacing: -.04em; }
.kpi-foot { color: #9ba5a2; font-size: 9px; }

.section-heading { margin: 18px 0 9px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.section-heading h2 { font-size: 13px; margin: 0; font-weight: 800; }
.section-heading span { color: var(--muted-2); font-size: 9.5px; }

/* Visual block similar to finance chart in reference */
.portfolio-panel { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(220px, .7fr); gap: 0; overflow: hidden; }
.portfolio-chart { padding: 16px 18px 14px; border-left: 1px solid var(--line); }
.chart-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.chart-head strong { font-size: 12px; }
.chart-legend { display: flex; gap: 10px; font-size: 9px; color: var(--muted); }
.chart-legend i { width: 7px; height: 7px; border-radius: 2px; display: inline-block; margin-inline-end: 4px; }
.chart-legend .a { background: var(--brand); }
.chart-legend .b { background: var(--mint); }
.bar-chart {
  height: 190px;
  display: flex;
  align-items: flex-end;
  gap: 10px;
  padding: 10px 6px 28px;
  border-bottom: 1px solid var(--line);
  background-image: linear-gradient(to top, #edf1f0 1px, transparent 1px);
  background-size: 100% 25%;
  direction: ltr;
}
.bar-group { flex: 1; min-width: 24px; height: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 3px; position: relative; }
.bar { width: min(16px, 42%); border-radius: 4px 4px 1px 1px; background: var(--brand); min-height: 5px; }
.bar.alt { background: var(--mint); }
.bar-label { position: absolute; bottom: -23px; left: 50%; transform: translateX(-50%); max-width: 75px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 8px; color: #909b98; }
.portfolio-summary { padding: 16px; display: grid; align-content: center; gap: 14px; }
.summary-stat { padding: 0 0 14px; border-bottom: 1px solid var(--line); }
.summary-stat:last-child { border-bottom: 0; padding-bottom: 0; }
.summary-stat span { color: var(--muted); font-size: 9px; display: block; }
.summary-stat b { display: block; font-size: 21px; margin-top: 5px; font-weight: 750; }
.summary-stat small { font-size: 8.5px; color: var(--green); font-weight: 700; }

.chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 7px; border-radius: 7px; font-size: 8.5px; font-weight: 800; background: var(--surface-muted); color: #495754; white-space: nowrap; }
.chip.green { background: var(--green-soft); color: #05875a; }
.chip.yellow { background: var(--yellow-soft); color: #9a7114; }
.chip.red { background: var(--red-soft); color: #c2475b; }
.chip.orange { background: var(--orange-soft); color: #b46428; }
.chip.dark { background: #edf2f0; color: #48615b; }

.action-list { display: grid; }
.action-row {
  display: grid;
  grid-template-columns: minmax(170px, .9fr) minmax(260px, 1.6fr) auto;
  gap: 12px;
  align-items: center;
  padding: 10px 9px;
  border-bottom: 1px solid #edf0ef;
  background: #fff;
}
.action-row:last-child { border-bottom: 0; }
.action-row strong { font-size: 10.5px; }
.action-row small { color: var(--muted); line-height: 1.55; font-size: 9.5px; }

.table-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.table-toolbar .filters { display: flex; gap: 6px; flex-wrap: wrap; }
.control {
  background: var(--surface);
  border: 1px solid var(--line-strong);
  color: var(--ink);
  border-radius: 9px;
  padding: 8px 10px;
  outline: none;
  font-size: 10px;
}
.control:focus { border-color: #9eb6b0; box-shadow: 0 0 0 3px rgba(7,95,99,.06); }
.table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 11px; }
table { width: 100%; border-collapse: collapse; min-width: 820px; background: var(--surface); }
th, td { padding: 9px 10px; text-align: right; border-bottom: 1px solid #edf0ef; vertical-align: top; }
th { position: sticky; top: 0; z-index: 2; background: #fafbfb; font-size: 8.5px; color: #87918e; font-weight: 750; white-space: nowrap; letter-spacing: .01em; }
td { font-size: 9.5px; line-height: 1.55; color: #3f4c49; }
tr:hover td { background: #fbfdfc; }

.progress { height: 6px; background: #edf1ef; border-radius: 999px; overflow: hidden; }
.progress > span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--brand), var(--mint)); }

.scenario-layout { display: grid; grid-template-columns: minmax(0, 1.16fr) minmax(320px, .84fr); gap: 12px; }
.scenario-form { padding: 17px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
.field { display: grid; gap: 6px; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 9.5px; font-weight: 800; color: #4d5a57; }
.field small { color: var(--muted); line-height: 1.5; font-size: 8.5px; }
.field select, .field input {
  width: 100%;
  background: #fff;
  border: 1px solid var(--line-strong);
  border-radius: 9px;
  padding: 9px 10px;
  color: var(--ink);
  outline: none;
  font-size: 10px;
}
.field select:focus, .field input:focus { border-color: #9eb6b0; box-shadow: 0 0 0 3px rgba(7,95,99,.06); }
.field input[type="range"] { padding: 0; accent-color: var(--brand); }
.range-line { display: flex; justify-content: space-between; font-size: 8.5px; color: var(--muted); }
.scenario-result {
  padding: 18px;
  background: linear-gradient(145deg, #086168 0%, #07545a 100%);
  color: white;
  border: 0;
  position: sticky;
  top: 12px;
  align-self: start;
  box-shadow: none;
}
.scenario-result .muted { color: rgba(255,255,255,.66); }
.result-number { font-size: 30px; font-weight: 850; letter-spacing: -.04em; }
.result-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; margin: 14px 0; }
.result-box { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); border-radius: 10px; padding: 10px; }
.result-box span { font-size: 8.5px; color: rgba(255,255,255,.68); }
.result-box b { display: block; font-size: 15px; margin-top: 4px; }
.scenario-notes { display: grid; gap: 6px; margin-top: 12px; }
.note-line { padding: 8px 9px; border-radius: 9px; background: rgba(255,255,255,.07); font-size: 8.8px; line-height: 1.55; }

.program-card { padding: 14px; display: grid; gap: 10px; min-height: 182px; }
.program-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.program-top strong { font-size: 11px; line-height: 1.5; }
.program-score { width: 48px; height: 48px; border-radius: 13px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); font-weight: 850; font-size: 12px; }
.program-audience { color: var(--muted); font-size: 9.5px; line-height: 1.6; min-height: 38px; }
.meta-row { display: flex; gap: 6px; flex-wrap: wrap; }

.empty-state { padding: 32px 16px; text-align: center; color: var(--muted); font-size: 10px; }
.empty-state strong { display: block; color: var(--ink); margin-bottom: 5px; }
.toast { position: fixed; left: 22px; bottom: 22px; background: #183e3d; color: #fff; padding: 10px 12px; border-radius: 10px; box-shadow: var(--shadow); opacity: 0; transform: translateY(12px); pointer-events: none; transition: .2s ease; z-index: 100; max-width: 360px; font-size: 10px; }
.toast.show { opacity: 1; transform: translateY(0); }
.muted { color: var(--muted); }
.tiny { font-size: 9px; line-height: 1.5; margin-top: 7px; }
.text-danger { color: var(--red); }
.text-success { color: var(--green); }
.text-warning { color: var(--yellow); }

.search-results { position: fixed; top: 82px; right: calc((100vw - min(1500px, calc(100vw - 44px))) / 2 + 246px); width: min(530px, calc(100vw - 320px)); background: var(--surface); border: 1px solid var(--line); border-radius: 13px; box-shadow: 0 18px 50px rgba(28,44,40,.16); z-index: 50; max-height: 420px; overflow: auto; display: none; }
.search-results.show { display: block; }
.search-result { padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 10px; }
.search-result:last-child { border-bottom: 0; }
.search-result small { color: var(--muted); }

@media (max-width: 1180px) {
  .app-shell { width: calc(100% - 24px); margin: 12px auto; min-height: calc(100vh - 24px); }
  .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .scenario-layout { grid-template-columns: 1fr; }
  .scenario-result { position: static; }
  .portfolio-panel { grid-template-columns: 1fr; }
  .portfolio-chart { border-left: 0; border-bottom: 1px solid var(--line); }
}

@media (max-width: 900px) {
  .app-shell { grid-template-columns: 1fr; grid-template-areas: "main"; width: 100%; min-height: 100vh; margin: 0; border-radius: 0; }
  .sidebar { position: fixed; right: 0; left: auto; top: 0; transform: translateX(105%); transition: transform .25s ease; width: 250px; min-height: 100vh; box-shadow: -18px 0 50px rgba(25,49,44,.14); border-left: 1px solid var(--line); border-right: none; }
  .sidebar.open { transform: translateX(0); }
  .mobile-only { display: inline-grid; place-items: center; }
  .topbar { padding: 13px 16px 10px; align-items: flex-start; }
  .topbar-actions { flex: 1; justify-content: flex-end; }
  .global-search-wrap { min-width: 0; width: min(330px, 100%); }
  .page-root { padding: 0 16px 24px; }
  .status-strip { margin-inline: 16px; }
  .search-results { right: 16px; left: 16px; top: 68px; width: auto; }
}

@media (max-width: 640px) {
  .topbar { flex-direction: column; }
  .topbar-actions { width: 100%; }
  .global-search-wrap { width: 100%; }
  .refresh-button span { display: none; }
  .grid-4, .grid-3, .grid-2, .form-grid { grid-template-columns: 1fr; }
  .field.full { grid-column: auto; }
  .action-row { grid-template-columns: 1fr; }
  .topbar h1 { font-size: 17px; }
  .hero-banner { grid-template-columns: 1fr; padding: 18px; }
  .hero-actions { justify-content: flex-start; }
  .hero-value { font-size: 27px; }
  .bar-chart { height: 165px; gap: 6px; }
}



/* ===== V1.2 Arabic / RTL / Usability pass ===== */
body {
  direction: rtl;
  font-family: "Noto Sans Arabic UI", "Noto Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
}
.app-shell {
  grid-template-columns: minmax(0, 1fr) 238px;
  grid-template-areas: "main sidebar";
  direction: rtl;
}
.sidebar {
  grid-area: sidebar;
  direction: rtl;
  border-right: 0;
  border-left: 1px solid var(--line);
}
.main { grid-area: main; direction: rtl; }
.nav-item { justify-content: flex-start; width: 100%; }
.nav-item span { flex: 0 0 22px; }
.brand { justify-content: flex-start; }
.brand-subtitle { letter-spacing: 0; }
.topbar { direction: rtl; }
.topbar-title { flex: 1; }
.topbar-actions { direction: rtl; }
.global-search-wrap { direction: rtl; }
.global-search-wrap input,
.control,
.field select,
.field input { direction: rtl; text-align: right; }
input[type="range"] { direction: ltr; }
.num, .kpi-value, .hero-value, .program-score, .result-number, .result-box b, .summary-stat b {
  direction: ltr;
  unicode-bidi: isolate;
}
.table-wrap table { direction: rtl; }
th, td { text-align: right; unicode-bidi: plaintext; }
th:first-child, td:first-child { padding-inline-start: 16px; }
.search-results {
  right: auto;
  left: calc((100vw - min(1500px, calc(100vw - 44px))) / 2 + 22px);
}
.search-result { cursor: pointer; transition: .16s ease; }
.search-result:hover { background: #f3f8f6; }

/* stronger visual hierarchy */
.page-root { padding-top: 2px; }
.page-intro {
  display: grid;
  grid-template-columns: minmax(0,1fr) auto;
  gap: 18px;
  align-items: center;
  padding: 16px 18px;
  margin: 0 0 14px;
  border: 1px solid #dfe8e5;
  border-radius: 16px;
  background: linear-gradient(135deg, #fbfdfc, #f4f8f7);
}
.page-intro h2 { margin: 0 0 5px; font-size: 15px; color: #173532; }
.page-intro p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.8; }
.page-intro-actions { display:flex; flex-wrap:wrap; gap:7px; justify-content:flex-end; }
.ui-button {
  border: 1px solid #d8e2df;
  background: #fff;
  color: #24443f;
  border-radius: 10px;
  min-height: 36px;
  padding: 0 12px;
  font-size: 10.5px;
  font-weight: 800;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  text-decoration:none;
  transition:.16s ease;
}
.ui-button:hover { transform: translateY(-1px); border-color:#b9cbc6; box-shadow:0 5px 16px rgba(17,55,46,.07); }
.ui-button.primary { background: var(--brand); color:#fff; border-color:var(--brand); }
.ui-button.soft { background: var(--brand-soft); color:var(--brand); border-color:#d6e9e5; }

.action-guide {
  display:grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap:10px;
  margin-bottom:14px;
}
.action-step {
  position:relative;
  overflow:hidden;
  min-height:94px;
  padding:14px 14px 13px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
  box-shadow:var(--shadow-card);
}
.action-step .step-no {
  width:28px;height:28px;border-radius:9px;
  display:grid;place-items:center;
  background:var(--brand-soft); color:var(--brand);
  font-weight:900; font-size:11px; margin-bottom:9px;
}
.action-step strong { display:block; font-size:11px; margin-bottom:4px; }
.action-step small { color:var(--muted); font-size:9.5px; line-height:1.7; }
.action-step::after { content:""; position:absolute; width:70px;height:70px;border-radius:50%; background:rgba(7,95,99,.035); left:-28px; bottom:-32px; }

.kpi-card { position:relative; overflow:hidden; min-height:118px; }
.kpi-card::after { content:""; position:absolute; width:74px;height:74px;border-radius:22px; background:var(--brand-soft); left:-24px; bottom:-28px; transform:rotate(20deg); opacity:.8; }
.kpi-label { position:relative; z-index:1; }
.kpi-value { position:relative; z-index:1; }
.kpi-foot { position:relative; z-index:1; }
.metric-icon { width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);font-size:15px;margin-bottom:12px; }

.section-heading { margin-top:20px; }
.section-heading h2 { font-size:13px; }
.section-heading span { font-size:9.5px; }

.card { border-color:#e1e8e5; }
.card.pad { padding:14px; }
.card-title h2 { font-size:14px; }

.hero-banner { min-height:152px; padding:25px 26px; }
.hero-eyebrow { font-size:10.5px; }
.hero-value { font-size:30px; }
.hero-sub { font-size:11px; max-width:670px; }
.hero-pill { min-height:38px; border-radius:10px; padding:0 13px; }

/* status + explanations */
.legend-strip {
  display:flex; flex-wrap:wrap; gap:7px; align-items:center;
  padding:10px 12px; border:1px dashed #d9e4e1; border-radius:12px; background:#fbfdfc; margin-bottom:12px;
}
.legend-item { display:inline-flex;align-items:center;gap:6px;color:#667672;font-size:9.5px; }
.legend-dot { width:8px;height:8px;border-radius:50%; }
.legend-dot.green{background:#17b47a}.legend-dot.yellow{background:#d6a12b}.legend-dot.red{background:#e76577}.legend-dot.gray{background:#9aa8a4}

.decision-box {
  border:1px solid #dce8e4;
  border-radius:14px;
  padding:13px 14px;
  background:#f8fbfa;
  margin-top:12px;
}
.decision-box strong { font-size:11px; }
.decision-box p { margin:5px 0 0; font-size:9.5px; color:var(--muted); line-height:1.75; }

/* Simulator becomes an explicit decision workspace */
.scenario-layout { align-items:start; }
.scenario-form { padding:18px; }
.scenario-result { position:sticky; top:92px; padding:20px; }
.scenario-result .result-number { margin-top:7px; }
.scenario-result[data-gate="GREEN"] { background:linear-gradient(160deg,#075f63,#064d50); }
.scenario-result[data-gate="YELLOW"] { background:linear-gradient(160deg,#695119,#3d3525); }
.scenario-result[data-gate="RED"] { background:linear-gradient(160deg,#6d3941,#4a2f34); }
.scenario-status-row { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 4px; }
.scenario-status-pill { background:rgba(255,255,255,.11); border:1px solid rgba(255,255,255,.14); color:#fff; padding:6px 9px; border-radius:999px; font-size:9px; }
.scenario-actions { display:flex;gap:7px;flex-wrap:wrap;margin-top:12px; }
.scenario-actions button { border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.10); color:#fff; border-radius:9px; padding:8px 10px; font-size:9.5px; font-weight:800; }
.scenario-actions button:hover { background:rgba(255,255,255,.17); }
.form-hint { display:flex;gap:7px;align-items:flex-start;margin-top:6px;color:#87948f;font-size:9px;line-height:1.6; }
.form-hint b { color:#52625e; }

/* cards become actionable */
.program-card { min-height:170px; display:flex; flex-direction:column; }
.program-card .program-card-actions { display:flex; gap:6px; margin-top:auto; padding-top:10px; border-top:1px solid #edf1f0; }
.program-card .program-card-actions button { border:0;background:var(--brand-soft);color:var(--brand);padding:7px 9px;border-radius:8px;font-size:9px;font-weight:800; }
.program-card .program-card-actions button.secondary { background:#f3f5f4;color:#66746f; }

.table-toolbar { gap:10px; }
.filters { flex-wrap:wrap; }
.control { min-height:38px; border-radius:10px; }
.table-wrap { border-radius:12px; border:1px solid #e7ecea; overflow:auto; }
table { border-collapse:separate; border-spacing:0; }
thead th { position:sticky; top:0; z-index:2; background:#f7faf9; color:#53635f; font-weight:800; font-size:9.5px; }
tbody tr:hover td { background:#fbfdfc; }
td { font-size:9.5px; line-height:1.7; }

/* guide page */
.system-map { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
.system-node { position:relative; padding:15px; min-height:124px; border:1px solid var(--line); border-radius:15px; background:#fff; }
.system-node .node-icon { width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);font-size:16px;margin-bottom:12px; }
.system-node strong { display:block;font-size:11px;margin-bottom:4px; }
.system-node small { color:var(--muted);font-size:9.5px;line-height:1.7; }
.system-node:not(:last-child)::before { content:"←"; position:absolute; left:-10px; top:50%; transform:translate(-50%,-50%); color:#9bacA7; font-size:17px; z-index:3; }
.help-grid { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px; }
.help-card { padding:15px;border:1px solid var(--line);border-radius:14px;background:#fff; }
.help-card h3 { margin:0 0 8px;font-size:11px; }
.help-card p,.help-card li { color:var(--muted);font-size:9.5px;line-height:1.8; }
.help-card ul { margin:0;padding-inline-start:18px; }

.toast { direction:rtl; }

@media (max-width: 1060px) {
  .app-shell { grid-template-columns: minmax(0,1fr); grid-template-areas: "main"; }
  .sidebar { position: fixed; top: 0; right: 0; left: auto; width: 260px; height: 100vh; min-height: 100vh; transform: translateX(105%); transition: transform .25s ease; border-left: 1px solid var(--line); border-right: none; box-shadow: -18px 0 48px rgba(25,45,40,.13); }
  .sidebar.open { transform: translateX(0); }
  .action-guide,.system-map { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .scenario-result { position:static; }
  .search-results { right:16px; left:16px; }
}
@media (max-width: 720px) {
  .page-intro { grid-template-columns:1fr; }
  .page-intro-actions { justify-content:flex-start; }
  .action-guide,.system-map,.help-grid { grid-template-columns:1fr; }
  .system-node:not(:last-child)::before { display:none; }
  .hero-banner { grid-template-columns:1fr; }
  .hero-actions { justify-content:flex-start; }
  .grid-4,.grid-3,.grid-2 { grid-template-columns:1fr; }
}

  function normalizeNum(value) {
    if (value == null) return NaN;
    let s = String(value).trim().replace(/[٠-٩]/g, d => arabicDigits.indexOf(d));
    s = s.replace(/٫/g, '.').replace(/٬/g, '').replace(/,/g, '').replace(/%/g, '');

      if (exact) return row[exact];
    }
    for (const hint of hints) {
      const key = keys.find(k => k.toLowerCase().includes(hint.toLowerCase()));
      if (key) return row[key];
    }
    return fallback;

  function dataModeLabel() { return state.live ? 'بيانات مباشرة من الشيت' : 'نسخة معاينة محفوظة'; }

  function csvParse(text) {
    const rows = [];
    let row = [], cell = '', i = 0, quoted = false;
    while (i < text.length) {
      const ch = text[i];
      if (quoted) {
        if (ch === '"') {
          if (text[i+1] === '"') { cell += '"'; i += 2; continue; }
          quoted = false; i++; continue;
        }
        cell += ch; i++; continue;
      }
      if (ch === '"') { quoted = true; i++; continue; }
      if (ch === ',') { row.push(cell); cell=''; i++; continue; }
      if (ch === '\n') { row.push(cell.replace(/\r$/, '')); rows.push(row); row=[]; cell=''; i++; continue; }
      cell += ch; i++;
    }
    if (cell.length || row.length) { row.push(cell.replace(/\r$/, '')); rows.push(row); }
    const clean = rows.filter(r => r.some(c => String(c).trim() !== ''));
    if (!clean.length) return [];
    const headers = clean[0].map((h, idx) => String(h || `Column ${idx+1}`).trim());
    return clean.slice(1).map(r => Object.fromEntries(headers.map((h, idx) => [h, r[idx] ?? ''])));
  }

  function gvizUrl(sheetName) {
    return `https://docs.google.com/spreadsheets/d/${encodeURIComponent(CFG.sheetId)}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
  }

  async function fetchSheet(sheetName) {
    const res = await fetch(gvizUrl(sheetName), { cache: 'no-store' });
    if (!res.ok) throw new Error(`${sheetName}: ${res.status}`);
    const text = await res.text();
    if (/<!doctype html|<html/i.test(text)) throw new Error(`${sheetName}: Google login/public access required`);
    return csvParse(text);
  }

  async function loadLiveData() {
    const entries = Object.entries(state.sourceNames);
    const result = {};
    const errors = [];
    await Promise.all(entries.map(async ([key, sheet]) => {
      try { result[key] = await fetchSheet(sheet); }
      catch (err) { errors.push(err.message); }
    }));
    if (!Object.keys(result).length) throw new Error(errors[0] || 'No live data');
    return { result, errors };
  }

  async function loadConfigSheet() {
    try {
      const rows = await fetchSheet('Dashboard Config');
      const sourceRows = rows.filter(r => String(r.Section || '').toLowerCase() === 'source' && String(r.Enabled || '').toLowerCase() !== 'false');
      if (sourceRows.length) {
        state.sourceNames = {};
        sourceRows.forEach(r => { if (r.Key && r.Value) state.sourceNames[r.Key] = r.Value; });
      }
      const refresh = rows.find(r => String(r.Key || '') === 'refresh_seconds');
      if (refresh && normalizeNum(refresh.Value) > 0) CFG.refreshMs = normalizeNum(refresh.Value) * 1000;
    } catch (_) {}
  }

  function applySnapshot() {
    state.data = {};
    Object.keys(state.sourceNames).forEach(k => state.data[k] = Array.isArray(SNAPSHOT[k]) ? SNAPSHOT[k] : []);
    Object.keys(SNAPSHOT).forEach(k => { if (Array.isArray(SNAPSHOT[k]) && !(k in state.data)) state.data[k] = SNAPSHOT[k]; });
    state.live = false;
    state.loadedAt = new Date();
  }

  async function refreshData(showToast = false) {
    setStatus('جاري تحديث الداتا...', 'normal');
    try {
      await loadConfigSheet();
      const { result, errors } = await loadLiveData();
      state.data = { ...state.data, ...result };
      state.live = true;
      state.loadedAt = new Date();
      buildSearchIndex();
      setStatus(errors.length ? `البيانات المباشرة شغالة مع تعذر تحميل ${errors.length} مصدر` : 'بيانات مباشرة من Google Sheet — للقراءة فقط', errors.length ? 'warning' : 'normal');

      if (CFG.fallbackToSnapshot) {
        applySnapshot();
        buildSearchIndex();

        setStatus('تعذر تحميل Google Sheet', 'error');
      }
    }
    renderCurrent();
  }

    const out = [];
    Object.entries(state.data).forEach(([source, rows]) => {

  function mapProgramNameToOpportunity(name='') {
    const n = slug(name).replace(/career coaching|round 2|fixed bonus planning|fixed planning|fixed ta planning|fixed project bonus planning|fixed portfolio bonus planning/g,'').trim();
    const opps = state.data.opportunities || [];
    return opps.find(o => {
      const on = slug(pick(o,['الفرصة']));
      return on.includes(n) || n.includes(on) || (n.includes('ui ux') && on.includes('ui ux')) || (n.includes('python') && on.includes('python')) || (n.includes('excel') && on.includes('excel'));
    });
  }

  function getScenarioPrograms() {
    return (state.data.finance || []).filter(r => {
      const name = pick(r,['البرنامج / القاعدة']);
      const price = normalizeNum(pick(r,['السعر التخطيطي']));
      const min = normalizeNum(pick(r,['Min Cohort']));
      return name && Number.isFinite(price) && Number.isFinite(min) && !/Rule|LTV|Margin Floor/i.test(name);
    });
  }

  function parseTargetRange(v, minFallback=10) {
    const nums = String(v || '').match(/\d+/g)?.map(Number) || [];
    return { low: nums[0] || minFallback, high: nums[1] || nums[0] || minFallback };
  }

  function programAliases(name='') {
    const n = slug(name);
    if (n.includes('ui ux')) return ['ui ux career'];
    if (n.includes('vibe')) return ['vibe coding'];
    if (n.includes('python')) return ['programming foundations python','programming python'];
    if (n.includes('excel')) return ['excel power bi','advanced excel power bi'];
    if (n.includes('data analysis')) return ['data analysis'];
    if (n.includes('digital marketing')) return ['digital marketing'];
    if (n.includes('graphic')) return ['graphic design'];
    if (n.includes('digital skills')) return ['digital skills basic','icdl'];
    if (n.includes('academic revision')) return ['academic revision camp'];
    return [n];
  }

  function findFinancialBase(programName, cohort) {
    const rows = state.data.financialModels || [];
    const aliases = programAliases(programName);
    const candidates = rows.filter(r => {
      const rn = slug(pick(r,['البرنامج']));
      return aliases.some(a => rn.includes(a));
    });
    if (!candidates.length) return null;
    const standard = candidates.filter(r => /standard|planning|pilot/i.test(pick(r,['Scenario'])) && !/stress/i.test(pick(r,['البرنامج'])));
    const pool = standard.length ? standard : candidates;
    return [...pool].sort((a,b)=> Math.abs(normalizeNum(pick(a,['عدد الطلاب']))-cohort)-Math.abs(normalizeNum(pick(b,['عدد الطلاب']))-cohort))[0];
  }

  function scenarioCalculation(programRow, cohort, adBudget) {
    const price = normalizeNum(pick(programRow,['السعر التخطيطي']));
    const min = normalizeNum(pick(programRow,['Min Cohort']));
    const target = parseTargetRange(pick(programRow,['Target']), min);
    const max = normalizeNum(pick(programRow,['Max قبل Capacity Review'])) || target.high;
    const base = findFinancialBase(pick(programRow,['البرنامج / القاعدة']), cohort);
    const instructor = base ? normalizeNum(pick(base,['Instructor Cost'])) : 0;
    const ops = base ? normalizeNum(pick(base,['Operations'])) : 0;
    const revenue = price * cohort;
    const paymentFees = revenue * .01;
    const contribution = revenue - instructor - ops - paymentFees - adBudget;
    const margin = revenue > 0 ? (contribution / revenue) * 100 : 0;
    const breakEven = price > 0 ? Math.ceil((instructor + ops + adBudget) / (price * .99)) : NaN;
    let gate = 'YELLOW';
    if (cohort < min || contribution < 0) gate = 'RED';
    else if (cohort >= target.low && margin >= 25) gate = 'GREEN';
    if (cohort > max) gate = 'YELLOW';
    return { price, min, target, max, instructor, ops, revenue, paymentFees, contribution, margin, breakEven, gate, base };
  }

  function initScenario(programs, universities, partners) {
    const pEl = document.getElementById('scProgram'); if (!pEl) return;
    const cEl = document.getElementById('scCohort'), aEl = document.getElementById('scAds'), uEl = document.getElementById('scUniversity'), partnerEl = document.getElementById('scPartner');
    let lastSummary='';
    const update = () => {
      const p = programs[Number(pEl.value) || 0];
      const min = normalizeNum(pick(p,['Min Cohort'])) || 10;
      const max = normalizeNum(pick(p,['Max قبل Capacity Review'])) || parseTargetRange(pick(p,['Target']),min).high;
      cEl.min=min; cEl.max=max; if(Number(cEl.value)<min)cEl.value=min; if(Number(cEl.value)>max)cEl.value=max;
      document.getElementById('scMinLabel').textContent=`الحد الأدنى ${min}`; document.getElementById('scMaxLabel').textContent=`الحد الأقصى ${max}`; document.getElementById('scCohortValue').textContent=`${cEl.value} طالب`;
      const opp=mapProgramNameToOpportunity(pick(p,['البرنامج / القاعدة']));
      document.getElementById('scAudience').textContent=opp?localizeText(pick(opp,['الفئة'])):'راجع الجمهور في فرص البرامج أو حزمة الإطلاق.';
      const cohort=Number(cEl.value), ads=Number(aEl.value), calc=scenarioCalculation(p,cohort,ads);
      document.getElementById('scContribution').textContent=money(calc.contribution); document.getElementById('scRevenue').textContent=money(calc.revenue); document.getElementById('scMargin').textContent=pct(calc.margin); document.getElementById('scBreakEven').textContent=Number.isFinite(calc.breakEven)?`${calc.breakEven} طالب`:'—';
      const gate=document.getElementById('scGate'); gate.textContent=displayGate(calc.gate); gate.style.color=calc.gate==='GREEN'?'#8ee4bd':calc.gate==='RED'?'#ffb1b8':'#ffd27b';
      document.getElementById('scenarioResultCard').dataset.gate=calc.gate;
      document.getElementById('scFinancialStatus').textContent=`الحالة المالية: ${displayGate(calc.gate)}`;
      const marketStatus=opp?pick(opp,['Current Validation Status']):'لا توجد حالة تحقق'; document.getElementById('scMarketStatus').textContent=`إثبات الطلب: ${localizeText(marketStatus)||'غير مثبت بعد'}`;
      document.getElementById('scProgress').style.width=`${Math.max(0,Math.min(100,(cohort/Math.max(calc.target.high,1))*100))}%`;
      const uni=uEl.value===''?null:universities[Number(uEl.value)], partner=partnerEl.value===''?null:partners[Number(partnerEl.value)];
      const notes=[
        `السعر التخطيطي: ${money(calc.price)} لكل طالب.`,
        `تكلفة المدرب المخططة: ${money(calc.instructor)} — التشغيل: ${money(calc.ops)} — الحملة: ${money(ads)}.`,
        `حدود الدفعة: حد أدنى ${calc.min}، هدف ${calc.target.low}${calc.target.high!==calc.target.low?'–'+calc.target.high:''}، حد أقصى ${calc.max}.`,
        opp?`اختبار السوق المطلوب: ${pick(opp,['Min Qualified Leads'])||'—'} مهتم مؤهل / ${pick(opp,['Min Paid/Deposits'])||'—'} مدفوع أو عربون.`:'',
        uni?`السوق: ${pick(uni,['الجامعة / المؤسسة'])} — أولوية ${pick(uni,['Priority Score'])||'—'}/100 — ${pick(uni,['Next Action'])}`:'',
        partner?`الشريك: ${pick(partner,['الجهة'])} — الخطوة التالية: ${pick(partner,['Next Step'])}`:'',
        ads>=10000?'⚠️ ميزانية الإعلان كبيرة؛ ما تعتبرها منطقية قبل إثبات التحويل المدفوع.':'ابدأ بأقل تكلفة وصول ممكنة، وبعد التنفيذ قارن CAC الفعلي بالتخطيط.',
        'المحاكي يحكم ماليًا فقط؛ قرار الإطلاق النهائي يحتاج إثبات طلب + جاهزية المدرب + التشغيل.'
      ].filter(Boolean).map(localizeText);
      document.getElementById('scNotes').innerHTML=notes.map(n=>`<div class="note-line">${esc(n)}</div>`).join('');
      lastSummary=[`برنامج: ${localizeText(pick(p,['البرنامج / القاعدة']))}`,`عدد الطلبة: ${cohort}`,`ميزانية الحملة: ${money(ads)}`,`الإيراد: ${money(calc.revenue)}`,`هامش المساهمة: ${money(calc.contribution)} (${pct(calc.margin)})`,`نقطة التعادل: ${calc.breakEven} طالب`,`الحكم المالي: ${displayGate(calc.gate)}`,`إثبات الطلب: ${localizeText(marketStatus)}`,uni?`السوق: ${localizeText(pick(uni,['الجامعة / المؤسسة']))}`:'',partner?`الشريك: ${localizeText(pick(partner,['الجهة']))}`:''].filter(Boolean).join('\n');
    };
    pEl.addEventListener('change',()=>{ cEl.value=parseTargetRange(pick(programs[Number(pEl.value)],['Target']),normalizeNum(pick(programs[Number(pEl.value)],['Min Cohort']))).low; update(); });
    [cEl,aEl,uEl,partnerEl,document.getElementById('scChannel')].forEach(el=>el&&el.addEventListener('input',update));
    document.getElementById('copyScenarioBtn')?.addEventListener('click',async()=>{ try{ await navigator.clipboard.writeText(lastSummary); toast('تم نسخ ملخص السيناريو'); }catch(_){ toast('تعذر النسخ التلقائي'); } });
    update();
  }

    return `${pageIntro('اختار السوق قبل ما تختار الحملة', 'درجة الجامعة هنا تقيس ملاءمة دخول يسر: حجم + وصول + علاقات + شراكات، وليست ترتيبًا أكاديميًا للجامعة.', [{label:'شوف الشركاء',page:'partners',primary:true,icon:'◎'},{label:'افتح الشيت',href:CFG.sheetUrl,icon:'↗'}])}${actionGuide([['ابدأ بالأعلى أولوية','A+ وA هما أول موجة توزيع، مش حكم على جودة الجامعة.'],['اقرأ الخطوة التالية','كل صف فيه الحركة المقترحة بدل حملة عامة بلا سياق.'],['اربطها بشريك','بعد اختيار الجامعة انتقل للعلاقات والشراكات وحدد قناة الدخول.']])}<div class="card pad"><div class="table-toolbar"><div class="filters"><input class="control" id="uniSearch" dir="auto" placeholder="ابحث عن جامعة أو خطوة تالية"><select class="control" id="uniTier"><option value="">كل مستويات الأولوية</option>${tiers.map(t=>`<option>${esc(t)}</option>`).join('')}</select></div><span class="chip dark">${rows.length} مؤسسة</span></div><div id="uniRows">${renderUniRows(rows)}</div></div>`;
  }
  function renderUniRows(rows){const sorted=[...rows].sort((a,b)=>normalizeNum(pick(b,['Priority Score']))-normalizeNum(pick(a,['Priority Score'])));return table(['الجامعة / المؤسسة','درجة الأولوية','المستوى','الخطوة التالية'],sorted.map(r=>[pick(r,['الجامعة / المؤسسة']),pick(r,['Priority Score']),pick(r,['Priority Tier']),pick(r,['Next Action'])]),[2]);}

  function partnersPage() {
    const rows=state.data.partners||[]; setTimeout(()=>wireTableFilter('partnerSearch','partnerStatus','partnerRows',rows,renderPartnerRows),0); const statuses=[...new Set(rows.map(r=>pick(r,['Status'])).filter(Boolean))];
    return `${pageIntro('العلاقات هنا للمتابعة والقرار', 'الداشبورد تعرض مين نستهدف وإيه الخطوة التالية. تسجيل التواصل الفعلي أو إضافة Contact يتم داخل Partnerships في الشيت.', [{label:'الجامعات',page:'universities',icon:'▦'},{label:'افتح الشيت للتسجيل',href:CFG.sheetUrl,primary:true,icon:'↗'}])}${actionGuide([['اختار شريك له Fit','ابدأ بالشريك المرتبط بالبرنامج والجامعة، مش بأكبر عدد متابعين فقط.'],['نفّذ الخطوة التالية','ورشة أو Demo أو Career session أقوى من طلب نشر إعلان مباشر.'],['سجّل النتيجة في الشيت','آخر تواصل والموعد والـQR والنتيجة تتكتب في Partnerships ثم تظهر هنا.']])}<div class="card pad"><div class="table-toolbar"><div class="filters"><input class="control" id="partnerSearch" dir="auto" placeholder="ابحث عن شريك أو جامعة"><select class="control" id="partnerStatus"><option value="">كل الأولويات</option>${statuses.map(t=>`<option>${esc(t)}</option>`).join('')}</select></div><span class="chip orange">المسؤول: كريم – العلاقات والشراكات</span></div><div id="partnerRows">${renderPartnerRows(rows)}</div></div>`;
  }
  function renderPartnerRows(rows){return table(['الجهة','الجامعة','الأولوية','البرامج المناسبة','الخطوة التالية','حالة التواصل'],rows.map(r=>[pick(r,['الجهة']),pick(r,['الجامعة']),pick(r,['Status']),pick(r,['Potential Courses']),pick(r,['Next Step']),pick(r,['Outreach Status'])]),[2,5]);}

  function validationPage() {
    const rows=state.data.validation||[]; const experiments=rows.filter(r=>/Experiment/i.test(pick(r,['النوع']))); const surveys=rows.filter(r=>/Survey/i.test(pick(r,['النوع']))); const show=experiments.length?experiments:rows;
    return `${pageIntro('إثبات الطلب أهم من الإعجاب', 'الاستبيان يوجّه، الحضور والسلوك أقوى، والعربون أو الدفع هو أقوى دليل قبل إطلاق برنامج جديد.', [{label:'محاكي الراوند',page:'scenario',icon:'◫'},{label:'افتح الشيت',href:CFG.sheetUrl,icon:'↗'}])}${legend()}${actionGuide([['ابدأ بالفرضية','شوف الحد المطلوب لكل تجربة بدل هدف عام زي “ناس مهتمة”.'],['نفّذ اختبارًا واحدًا','قائمة انتظار أو Demo أو ورشة، وبعدها افتح الدفع/العربون.'],['سجّل Actual Result','بعد التنفيذ اكتب النتيجة الفعلية في الشيت؛ ساعتها القرار يتحدّث.']])}<div class="page-grid grid-4">${cardKpi('تجارب سوق',experiments.length||'—','قائمة انتظار / Demo / عربون','✓')}${cardKpi('أسئلة الاستبيان',surveys.length||'—','أسئلة وفروع حسب الشريحة','?')}${cardKpi('نتائج فعلية مسجلة',rows.filter(r=>String(pick(r,['Actual Result'])).trim()).length||0,'لا يتم اختراع الأرقام','●')}${cardKpi('ترتيب قوة الدليل','الدفع أولًا','ثم السلوك ثم الرأي','↑')}</div><div class="section-heading"><h2>تجارب التحقق</h2><span>حدود أخضر / أصفر / أحمر</span></div><div class="card pad">${show.length?table(['البرنامج / الشريحة','الاختبار','أخضر','أصفر','أحمر','الحالة','النتيجة الفعلية','الخطوة التالية'],show.slice(0,40).map(r=>[pick(r,['البرنامج / الشريحة']),pick(r,['السؤال / الاختبار']),pick(r,['Green']),pick(r,['Yellow']),pick(r,['Red']),pick(r,['Status']),pick(r,['Actual Result']),pick(r,['Next Action'])]),[5]):'<div class="empty-state"><strong>البيانات المباشرة هي التي تعرض كل التجارب هنا.</strong>نسخة المعاينة لا تحتوي كل تفاصيل التحقق.</div>'}</div>`;
  }

  function financePage() {
    const rows=state.data.finance||[]; const models=state.data.financialModels||[];
    return `${pageIntro('اقرأ الربحية بعد التكلفة، مش الإيراد وحده', 'الأرقام هنا تخطيطية إلى أن تدخل تكاليف المدربين والحملات والدفع الفعلية. استخدمها كحاجز قرار قبل الصرف.', [{label:'محاكي الراوند',page:'scenario',primary:true,icon:'◫'},{label:'افتح الشيت',href:CFG.sheetUrl,icon:'↗'}])}${actionGuide([['ابدأ من التحكم المالي','راجع السعر والحد الأدنى والهدف ونظام المدرب.'],['قارن سيناريوهات الإعلان','شوف تأثير 0 / 5K / 10K / 20K بدل النظر للإيراد فقط.'],['استبدل الافتراضات بأرقام فعلية','بعد كل راوند حدّث التكلفة وCAC والتحصيل الحقيقي في الشيت.']])}<div class="page-grid grid-3">${cardKpi('برامج لها تحكم مالي',rows.filter(r=>Number.isFinite(normalizeNum(pick(r,['السعر التخطيطي'])))).length,'تخطيط للقراءة فقط','◒')}${cardKpi('صفوف النماذج المالية',models.length||'—','دفعات + اختبارات حملات','▤')}${cardKpi('حد الربحية المقترح','25–30%','قبل التوسع المدفوع','%')}</div><div class="section-heading"><h2>التحكم المالي</h2><span>واجهة القرار السريع</span></div><div class="card pad">${table(['البرنامج / القاعدة','السعر التخطيطي','الحد الأدنى','الهدف','الحد الأقصى','نظام أجر المدرب','قاعدة الاستحواذ','حد الربحية','الحالة'],rows.slice(0,40).map(r=>[pick(r,['البرنامج / القاعدة']),pick(r,['السعر التخطيطي']),pick(r,['Min Cohort']),pick(r,['Target']),pick(r,['Max قبل Capacity Review']),pick(r,['Instructor Model']),pick(r,['Acquisition Rule']),pick(r,['Margin Gate']),pick(r,['Status'])]),[8])}</div><div class="section-heading"><h2>النماذج المالية</h2><span>السيناريوهات الحالية من الشيت</span></div><div class="card pad">${models.length?table(['البرنامج','عدد الطلاب','سعر الطالب','تكلفة المدرب','الحملة','التشغيل','هامش المساهمة','السيناريو'],models.slice(0,70).map(r=>[pick(r,['البرنامج']),pick(r,['عدد الطلاب']),pick(r,['سعر الطالب']),pick(r,['Instructor Cost']),pick(r,['Marketing']),pick(r,['Operations']),pick(r,['Contribution']),pick(r,['Scenario'])])):'<div class="empty-state">لا توجد نماذج في نسخة المعاينة.</div>'}</div>`;
  }

  function explorerPage() {
    setTimeout(()=>{const input=document.getElementById('explorerSearch'),source=document.getElementById('explorerSource');const draw=()=>{const q=(input.value||'').trim().toLowerCase(),s=source.value;const rows=state.searchIndex.filter(x=>(!s||x.source===s)&&(!q||x.text.includes(q))).slice(0,100);document.getElementById('explorerRows').innerHTML=rows.map(x=>`<div class="action-row"><strong>${esc(x.title)}</strong><small dir="auto">${esc(Object.values(x.row).slice(0,5).join(' · '))}</small><span class="chip dark">${esc(x.label)}</span></div>`).join('')||'<div class="empty-state">لا توجد نتائج.</div>';};input.addEventListener('input',draw);source.addEventListener('change',draw);draw();},0);
    return `${pageIntro('ابحث قبل ما تلف في 27 Tab', 'اكتب اسم برنامج أو جامعة أو كلمة من القرار، واختر المصدر لو عايز تضيق البحث. النتائج للقراءة فقط.', [{label:'طريقة الاستخدام',page:'guide',icon:'؟'},{label:'افتح الشيت',href:CFG.sheetUrl,icon:'↗'}])}<div class="card pad"><div class="table-toolbar"><div class="filters" style="flex:1"><input class="control" id="explorerSearch" dir="auto" style="min-width:280px;flex:1" placeholder="ابحث في كل البيانات"><select class="control" id="explorerSource"><option value="">كل المصادر</option>${Object.entries(state.sourceNames).map(([k,v])=>`<option value="${esc(k)}">${esc(v)}</option>`).join('')}</select></div><span class="chip green">للقراءة فقط</span></div><div id="explorerRows" class="action-list"></div></div>`;
  }

  function guidePage() {
    return `${pageIntro('السيستم في دقيقة', 'لو فهمت الأربع خطوات دول مش هتحتاج تفتح كل Tabs ولا تحفظ مكان أي معلومة.', [{label:'ابدأ من النظرة العامة',page:'overview',primary:true,icon:'⌂'},{label:'افتح الشيت',href:CFG.sheetUrl,icon:'↗'}])}<div class="system-map"><div class="system-node"><div class="node-icon">▦</div><strong>1. Google Sheet</strong><small>المصدر الوحيد للحقيقة: الأسعار، البرامج، الجامعات، الشركاء، النتائج والتحديثات.</small></div><div class="system-node"><div class="node-icon">↻</div><strong>2. تحديث الداشبورد</strong><small>الداشبورد تقرأ نفس البيانات. لو القراءة المباشرة غير متاحة يظهر بوضوح أنك على نسخة معاينة.</small></div><div class="system-node"><div class="node-icon">⌕</div><strong>3. ابحث / فلتر / حاكي</strong><small>مسموح تقارن وتفلتر وتحسب سيناريوهات. لا يوجد أي تعديل على البيانات من هنا.</small></div><div class="system-node"><div class="node-icon">↗</div><strong>4. نفّذ في الشيت</strong><small>أي إضافة أو تغيير أو تسجيل نتيجة يتم في الشيت، وبعدها اضغط تحديث لتظهر هنا.</small></div></div><div class="section-heading"><h2>إمتى أستخدم كل صفحة؟</h2><span>اختصار التشغيل اليومي</span></div><div class="help-grid"><div class="help-card"><h3>نظرة عامة</h3><p>ابدأ منها كل مرة. لو فيه قرار مفتوح أو عائق هيبان هنا قبل ما تدخل التفاصيل.</p></div><div class="help-card"><h3>محاكي الراوند</h3><p>قبل إطلاق أو حملة: اختار التراك والعدد والسوق والحملة. اقرأ الحالة المالية منفصلة عن إثبات الطلب.</p></div><div class="help-card"><h3>البرامج والفرص</h3><p>لما تسأل “نعمل إيه بعد كده؟”. قارن الدرجة والقرار وقوة الدليل وحدود الاختبار.</p></div><div class="help-card"><h3>الجامعات + العلاقات</h3><p>لما تسأل “نستهدف مين وندخل منين؟”. اختار الجامعة ثم الشريك ثم الخطوة التالية وسجل التنفيذ في الشيت.</p></div><div class="help-card"><h3>تحقق السوق</h3><p>لما تسأل “هل الناس فعلًا هتدفع؟”. الاعتماد يكون على العربون/الدفع أكثر من المشاهدات أو الاستبيان.</p></div><div class="help-card"><h3>الماليات</h3><p>لما تسأل “الراوند يستاهل؟”. ركز على هامش المساهمة ونقطة التعادل بعد التكاليف، مش الإيراد فقط.</p></div></div><div class="section-heading"><h2>قواعد تمنع سوء الفهم</h2><span>مهم قبل أي قرار</span></div>${legend()}<div class="help-grid"><div class="help-card"><h3>التخطيط ≠ الحقيقة</h3><ul><li>تكاليف المدربين الحالية قد تكون افتراضات حتى يتم الاتفاق.</li><li>أرقام الإعلانات المستهدفة ليست CAC حقيقي.</li><li>درجة الفرصة لا تعني أن الطلب المدفوع تم إثباته.</li></ul></div><div class="help-card"><h3>المحاكي لا يطلق البرنامج</h3><ul><li>الأخضر المالي معناه أن السيناريو مقبول حسب الافتراضات.</li><li>لازم كمان إثبات سوق، جاهزية مدرب، وسياسة دفع وتشغيل.</li><li>بعد التنفيذ، البيانات الفعلية هي اللي تصحح القرارات.</li></ul></div></div>`;
  }

  function table(headers, rows, statusCols=[]) {
    return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map((v,i)=>{const numeric=/^-?[\d٠-٩][\d٠-٩.,٫٬%\s/-]*$/.test(String(v??'').trim());return `<td dir="auto">${statusCols.includes(i)?`<span class="chip ${statusClass(v)}">${esc(v)}</span>`:`<span class="${numeric?'num':''}">${esc(v)}</span>`}</td>`;}).join('')}</tr>`).join('')}</tbody></table></div>`;
  }

  function wireTableFilter(searchId, selectId, rootId, rows, renderer) {
    const input = document.getElementById(searchId), select = document.getElementById(selectId), root = document.getElementById(rootId);
    if (!input || !select || !root) return;
    const run = () => {
      const q = input.value.trim();
      const filter = select.value;
      const filtered = rows.filter(r => contains(r,q) && (!filter || Object.values(r).some(v=>String(v)===filter)));
      root.innerHTML = renderer(filtered);
    };
    input.addEventListener('input',run); select.addEventListener('change',run);
  }

  function renderCurrent() {
    const [title, subtitle] = PAGE_META[state.page] || PAGE_META.overview;
    els.title.textContent = title; els.subtitle.textContent = subtitle;
    els.nav.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));
    const renderers = { overview, scenario:scenarioPage, programs:programsPage, universities:universitiesPage, partners:partnersPage, validation:validationPage, finance:financePage, explorer:explorerPage, guide:guidePage };
    els.root.innerHTML = (renderers[state.page] || overview)();
  }

  function goto(page) {
    state.page = page;
    els.sidebar.classList.remove('open');
    renderCurrent();
    window.scrollTo({top:0,behavior:'smooth'});
  }

  function globalSearch(q) {
    document.querySelector('.search-results')?.remove();
    if (!q || q.trim().length < 2) return;
    const items = state.searchIndex.filter(x=>x.text.includes(q.trim().toLowerCase())).slice(0,12);
    const box = document.createElement('div'); box.className='search-results show';
    const sourcePage={opportunities:'programs',universities:'universities',partners:'partners',validation:'validation',finance:'finance',financialModels:'finance',decision:'overview',launch:'programs',kpis:'overview',marketing:'explorer'};
    box.innerHTML = items.length ? items.map(x=>`<div class="search-result" data-search-page="${sourcePage[x.source]||'explorer'}"><strong>${esc(x.title)}</strong><div><small>${esc(x.label)} · ${esc(Object.values(x.row).slice(0,3).join(' · '))}</small></div></div>`).join('') : '<div class="empty-state">لا توجد نتيجة.</div>';
    document.body.appendChild(box);
  }

  els.nav.addEventListener('click', e=>{ const btn=e.target.closest('[data-page]'); if(btn) goto(btn.dataset.page); });
  document.addEventListener('click', e=>{ const btn=e.target.closest('[data-quick-page]'); if(btn) goto(btn.dataset.quickPage); });
  els.refresh.addEventListener('click', ()=>refreshData(true));
  els.search.addEventListener('input', e=>globalSearch(e.target.value));
  document.addEventListener('click', e=>{ const r=e.target.closest('[data-search-page]'); if(r){ goto(r.dataset.searchPage); document.querySelector('.search-results')?.remove(); els.search.value=''; } });
  document.addEventListener('click', e=>{ if(!e.target.closest('.global-search-wrap') && !e.target.closest('.search-results')) document.querySelector('.search-results')?.remove(); });
  els.menu?.addEventListener('click',()=>els.sidebar.classList.toggle('open'));

  applySnapshot(); buildSearchIndex(); renderCurrent();
  refreshData(false);
  setInterval(()=>refreshData(false), CFG.refreshMs || 120000);
})();

</script>
</body>
</html>
